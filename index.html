<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>استراتيجياتي الصفية</title>
<style>
:root{--ink:#2b2a4c;--cream:#fff8ec;--line:#eadfc9;--coral:#ff6b5b;--violet:#7c5cff;--teal:#19a7a1;--amber:#f59e0b;--leaf:#4caf6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Geeza Pro","SF Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;font-size:18px;background:var(--cream);color:var(--ink);min-height:100vh;touch-action:manipulation;
background-image:radial-gradient(circle at 8% 0%,#ffe6bd 0,transparent 38%),radial-gradient(circle at 100% 15%,#d9f2ec 0,transparent 34%)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;min-height:50px;padding:0 22px;font-weight:700;color:#fff;background:var(--c,var(--ink));transition:transform .12s,opacity .2s;box-shadow:0 4px 0 rgba(0,0,0,.14)}
button:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.14)}
button:disabled{opacity:.5}
button.soft{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
button.xl{min-height:64px;font-size:22px;padding:0 34px;border-radius:22px}
input[type=text],input:not([type]),input[type=number],textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus{outline:3px solid #ffd98a;border-color:#f5b83d}
.muted{color:#6b6a85;margin:6px 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}.row.end{justify-content:flex-start}
/* top */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(255,248,236,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.brand{background:var(--ink);white-space:nowrap}
.chipsnav{display:flex;gap:8px;flex:1;overflow-x:auto;padding:4px 2px}
.cn{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;white-space:nowrap}
.cn.on{background:var(--c);color:#fff;border-color:var(--c)}
.snd{padding:0 14px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:22px;box-shadow:none}
#main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
/* home */
.hero{text-align:center;padding:26px 0 10px}
.hero h1{font-size:42px;margin:0 0 8px}
.hero p{margin:0;color:#6b6a85;font-size:20px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:26px 0}
.classcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;min-height:190px;border-radius:30px;font-size:24px;justify-content:center}
.classcard .n{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.28);font-size:32px}
.classcard small{font-size:16px;font-weight:600;opacity:.92}
.sub{margin:30px 0 14px}
.strats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.scard{background:#fff;border:2px solid var(--line);border-top:8px solid var(--c);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px}
.scard span{font-size:34px}.scard small{color:#6b6a85;line-height:1.6}
.warn{background:#fff1d6;border:2px solid #f5b83d;padding:12px 16px;border-radius:14px;margin-top:20px}
/* class */
.classhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:28px;padding:18px 24px;margin-bottom:16px}
.classhead h1{margin:0;font-size:32px;display:flex;align-items:center;gap:10px}
.classhead p{margin:4px 0 0;opacity:.92}
.classhead button{background:#fff;color:var(--ink)}
.classhead h1 button{min-height:42px;padding:0 12px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.tab{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;white-space:nowrap;font-size:18px}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.stage{background:#fff;border:2px solid var(--line);border-radius:30px;padding:24px;min-height:420px}
.empty{text-align:center;padding:40px 10px}.empty .big{font-size:64px}
/* minute */
.qin{font-size:22px;text-align:center}
.qshow{font-size:30px;font-weight:800;text-align:center;margin:14px 0;min-height:44px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.chip.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.ring{position:relative;width:min(340px,80vw);margin:10px auto 18px}
.ring svg{width:100%;display:block}
.ring-bg{fill:#fff7f0;stroke:#ffe1d6;stroke-width:22}
.ring-fg{fill:none;stroke:var(--coral);stroke-width:22;stroke-linecap:round;transition:stroke .3s}
.time{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.ring.urgent .ring-fg{stroke:#e11d48}.ring.urgent .time{color:#e11d48;animation:beat .8s infinite}
.ring.done .time{font-size:44px;color:#e11d48;animation:beat .6s 4}
@keyframes beat{50%{transform:scale(1.08)}}
/* random */
.bigname{min-height:200px;display:grid;place-items:center;background:linear-gradient(135deg,#f1ecff,#e6f7f5);border-radius:30px;font-size:58px;font-weight:800;text-align:center;padding:20px;margin-bottom:20px}
.bigname .ph{color:#a9a6c6;font-size:40px}
.bigname.win{background:linear-gradient(135deg,#fff3c4,#ffd9c9);animation:pop .6s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:26px;height:26px;min-height:0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{background:#f1ecff;padding:8px 14px;border-radius:99px;font-weight:600}
.pill.used{opacity:.35;text-decoration:line-through}
/* stepper */
.stepper{display:inline-flex;align-items:center;gap:10px;background:#f6f1e6;border-radius:18px;padding:6px}
.stepper button{min-height:44px;width:48px;padding:0;font-size:24px;background:#fff;color:var(--ink);box-shadow:none}
.stepper b{min-width:34px;text-align:center;font-size:24px}
/* coop */
.coopbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gcard{border-radius:24px;border:3px solid var(--g);background:#fff;overflow:hidden;animation:pop .5s backwards}
.gcard h3{margin:0;background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.gcard ul{list-style:none;margin:0;padding:10px 14px}
.gcard li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.gcard li:last-child{border:0}
.role{font-size:14px;background:#fff3c4;border-radius:99px;padding:2px 10px;white-space:nowrap}
/* train */
.trainbox{position:relative;max-width:900px;margin:0 auto}
.trainbox svg{width:100%;display:block;border-radius:28px}
.tk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.ticket{background:#fffdf5;border:3px dashed #d9a441;border-radius:22px;padding:14px 26px;min-width:40%;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.ticket b{display:block;font-size:44px;line-height:1.3}
.ticket.win{animation:pop .6s;background:#fff3c4}
/* tree */
.treebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tree{border:3px solid var(--g);border-radius:26px;padding:10px;background:linear-gradient(#f4fbff,#f0fae9);text-align:center}
.gname{text-align:center;font-weight:800;border-color:transparent;background:rgba(255,255,255,.7);min-height:44px;padding:6px}
.tsvg{width:100%;display:block}
.fruit{transform-box:fill-box;transform-origin:center}
.fruit.pop{animation:pop .55s}
.tcount{font-size:18px;margin:2px 0 8px}.tcount b{font-size:26px;color:var(--g)}
.tbtn{display:flex;gap:8px}.tbtn .add{flex:1;background:var(--g)}.tbtn .rem{min-width:54px;padding:0}
.tree.pulse{animation:pop .4s}
/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(43,42,76,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:28px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px}
.modal .row{margin-top:12px}
.modal .row input{width:110px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:99px;z-index:60;font-weight:700;animation:pop .4s}
/* brand / hero */
.brand{display:flex;align-items:center;gap:8px;font-size:22px;letter-spacing:.5px}
.hero .logo{display:grid;place-items:center}
.lw{display:flex;gap:10px;align-items:center;justify-content:center;margin:4px 0}
.lw span{font-size:46px;font-weight:800;background:linear-gradient(90deg,#7c5cff,#19a7a1);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.4}
.lw button{min-height:40px;padding:0 10px;box-shadow:none}
.hero h1{font-size:30px;margin:0 0 10px}
.by{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:99px;padding:8px 24px;font-weight:700;margin:0}
.foot{text-align:center;color:#6b6a85;margin-top:36px;font-weight:600}
select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-height:48px}
/* avatars */
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:24px;vertical-align:middle;line-height:1}
.av.sm{width:30px;height:30px;font-size:18px}
.av.xl{width:100px;height:100px;font-size:62px}
/* award */
.award{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff7dc;border:2px dashed #f5b83d;border-radius:22px;padding:10px 16px;margin:14px auto 4px;max-width:680px}
.award[hidden]{display:none}
.awp{font-size:22px}
.plus{background:#2fa84f}.minus{background:#e24b5b}
/* points */
.ptbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.total{font-weight:800;margin:6px 0 14px;font-size:20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pcard{position:relative;border:3px solid var(--line);border-radius:24px;padding:12px;text-align:center;background:#fffdf8;overflow:hidden}
.avb{background:transparent;box-shadow:none;padding:0;min-height:0;border-radius:50%}
.avb .av{width:84px;height:84px;font-size:52px}
.pn{font-weight:800;margin:6px 0 2px;font-size:19px;word-break:break-word}
.pv{font-size:18px}.pv b{font-size:36px;color:#c98a00}
.pb{display:flex;gap:8px;margin-top:8px}.pb button{flex:1;padding:0}
.medal{position:absolute;top:6px;right:8px;font-size:28px}
.fl{position:absolute;left:50%;top:38%;font-size:36px;font-weight:800;animation:floatup .9s forwards;pointer-events:none}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.pcard.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* noise */
.noise{max-width:900px;margin:0 auto}
.nz-main{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.nono{width:min(320px,70vw);overflow:visible}
.nz-side{flex:1;min-width:240px}
.bubble{background:#fff;border:3px solid var(--lc,#19a7a1);border-radius:24px;padding:16px 20px;font-size:24px;font-weight:800;margin-bottom:14px;transition:border-color .3s}
.meter{height:26px;background:#eee7d6;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:10%;background:var(--lc,#19a7a1);border-radius:99px;transition:width .15s,background .3s}
.nz-lv{font-size:22px;font-weight:800;margin:10px 0}
.streak{color:#6b6a85}
.s0,.s1,.s2,.s3{display:none}
.lv0 .s0,.lv1 .s1,.lv2 .s2,.lv3 .s3{display:inline}
.ear{transition:transform .5s}
.el{transform-origin:105px 118px}.er{transform-origin:195px 118px}
.lv1 .el{transform:rotate(-10deg)}.lv1 .er{transform:rotate(10deg)}
.lv2 .el{transform:rotate(-40deg)}.lv2 .er{transform:rotate(40deg)}
.lv3 .el{transform:rotate(-125deg)}.lv3 .er{transform:rotate(125deg)}
.head{transition:fill .4s}
.lv2 .head{fill:#ffcf9a}.lv3 .head{fill:#ff9d8a}
.lv3 .face{animation:shake .25s infinite}
@keyframes shake{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
.slid{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0}
.slid input{width:220px;min-height:0;padding:0}
@media (max-width:640px){.hero h1{font-size:24px}.lw span{font-size:30px}.bigname{font-size:40px}.stage{padding:14px}}

/* شعار */
.brand span{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
@media (max-width:900px){.brand span{display:none}}
.lw{flex-wrap:wrap;max-width:900px;margin-inline:auto}
.lw span{line-height:1.6;text-wrap:balance;text-align:center}
.tag{margin:2px 0 6px;color:#6b6a85;font-size:15px;letter-spacing:.5px}
/* مكتبة القصص */
.stbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.gbadge{background:#ffe3ef;color:#a0225f;border-radius:99px;padding:6px 16px;font-weight:800}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 20px;padding:20px 14px 26px;border-radius:26px;background:linear-gradient(#efe6ff,#e3d6ff);box-shadow:inset 0 -14px 0 #b79be0}
.book{padding:0;min-height:0;text-align:start;background:#fff;color:var(--ink);border:0;border-radius:6px 18px 18px 6px;overflow:hidden;box-shadow:-6px 6px 0 #6a4bb5,0 14px 22px rgba(60,30,120,.28);display:flex;flex-direction:column;position:relative;transition:transform .2s}
.book:hover{transform:translateY(-6px) rotate(-1deg)}
.book .cov{aspect-ratio:5/4;width:100%;background:#cde;position:relative}
.book .cov svg{width:100%;height:100%;display:block}
.book .cb{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#fffaf0,#fff0d6)}
.book .ct{font-size:20px;font-weight:800}
.lchip,.vchip{align-self:flex-start;border-radius:99px;padding:3px 11px;font-size:14px;font-weight:700}
.lchip{background:#e6f0ff;color:#1f4fb0}.vchip{background:#e6f7ea;color:#1c7a3a}
.rb{position:absolute;top:8px;left:8px;background:#2fa84f;color:#fff;border-radius:99px;padding:3px 10px;font-size:14px;font-weight:800}
/* القارئ */
.rd{max-width:1000px;margin:0 auto}
.rdtop{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.rdt{font-size:24px;flex:1;text-align:center}
.scn{border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 0 rgba(43,42,76,.14),0 18px 34px rgba(60,30,120,.25);background:#cde;perspective:1200px}
.scn svg{display:block;width:100%;height:auto}
.scn-svg .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bob{animation:bob 2.8s ease-in-out infinite}
.tw{animation:ptw 2.4s ease-in-out infinite}
.drift{animation:drf 14s ease-in-out infinite alternate}
@keyframes drf{to{transform:translateX(26px)}}
.txt{font-size:27px;line-height:1.95;font-weight:600;background:#fffdf5;border:3px solid #f1e3bd;border-radius:24px;padding:18px 24px;margin:16px 0;box-shadow:0 6px 0 #f1e3bd}
.flipR{animation:flipR .55s ease both;transform-origin:right center}
.flipL{animation:flipL .55s ease both;transform-origin:left center}
@keyframes flipR{from{opacity:0;transform:rotateY(-70deg)}to{opacity:1;transform:none}}
@keyframes flipL{from{opacity:0;transform:rotateY(70deg)}to{opacity:1;transform:none}}
.chl{background:#eef4ff;border:3px solid #c3d6ff;border-radius:24px;padding:16px 20px;margin-bottom:16px;text-align:center}
.cq{font-size:24px;font-weight:800;margin-bottom:8px}
.cv{font-size:46px;line-height:1.5;white-space:pre-wrap;margin:6px 0 10px;unicode-bidi:plaintext;text-align:center}
.co{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.co button{min-height:66px;min-width:110px;font-size:28px;background:#fff;color:var(--ink);border:3px solid #c3d6ff;box-shadow:0 4px 0 #c3d6ff;white-space:pre-wrap;unicode-bidi:plaintext}
.co button.ok{background:#2fa84f;color:#fff;border-color:#2fa84f;box-shadow:none}
.co button.bad{animation:shk .35s;background:#ffe3e6;border-color:#e24b5b}
.cm{min-height:34px;margin-top:10px;font-size:21px;font-weight:700}
.cm.good{color:#1c7a3a}.cm.try{color:#b45309}
.rdnav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:14px;height:14px;border-radius:50%;background:#e4dccb}
.dots i.on{background:#e0559b;transform:scale(1.35)}.dots i.dn{background:#8fd09f}
.endbox{background:#fffdf5;border:3px solid #f1e3bd;border-radius:24px;padding:18px 22px;margin:16px 0;text-align:center}
.endbox h3{margin:0 0 8px;font-size:28px}
.recap{font-size:21px;line-height:1.8;margin:6px 0 14px}
.valcard{background:linear-gradient(135deg,#e6f7ea,#fff3c4);border:3px solid #9bd8a8;border-radius:22px;padding:14px 18px;margin:10px auto 16px;max-width:680px}
.valcard b{font-size:24px;color:#1c7a3a}.valcard q{display:block;font-size:26px;font-weight:800;margin:8px 0}.valcard small{color:#6b6a85;font-size:16px}
.valcard p{margin:6px 0 0;font-size:20px}
@media (max-width:640px){.txt{font-size:22px}.cv{font-size:36px}.co button{font-size:24px;min-width:90px}.shelf{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (prefers-reduced-motion:reduce){.bob,.tw,.drift,.flipR,.flipL{animation:none}}

/* عجلة وغياب وأعضاء الشجرة */
.pill.abs{opacity:.4;text-decoration:line-through;background:#ffe3e6}
.whl{max-width:560px;margin:0 auto;text-align:center}
.wsvg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 10px 14px rgba(60,30,120,.28))}
.wres{min-height:130px;display:grid;place-items:center;font-size:44px;font-weight:800;border-radius:24px;background:linear-gradient(135deg,#f1ecff,#e6f7f5);margin:12px 0;padding:10px}
.wres .ph{color:#a9a6c6;font-size:32px}
.wres.win{background:linear-gradient(135deg,#fff3c4,#ffd9c9);animation:pop .6s}
.gmem{width:100%;min-height:44px;font-size:15px;line-height:1.5;text-align:center;padding:6px 8px;border-radius:12px;margin:4px 0;resize:vertical;border:2px solid var(--line);background:rgba(255,255,255,.85)}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var rnd=function(a){return a[Math.floor(Math.random()*a.length)]};

var KEY='class-strategies-v1';
var CLASS_NAMES=['الفصل الأول','الفصل الثاني','الفصل الثالث','الفصل الرابع'];
var CLASS_COLORS=['#ff6b5b','#7c5cff','#19a7a1','#f59e0b'];
var PAL=['#ff6b5b','#7c5cff','#19a7a1','#f59e0b','#4caf6a','#e0559b','#3b82f6','#a16207','#0ea5a4','#ef4444'];

function ensureAvatars(c){
 if(!c.avatars)c.avatars={};
 var set=SETS[c.gender]||SETS.g,used={},k=0;
 c.students.forEach(function(n){if(set.indexOf(c.avatars[n])>=0)used[c.avatars[n]]=1});
 c.students.forEach(function(n){
  if(set.indexOf(c.avatars[n])<0){
   var pick=null;
   for(var i=0;i<set.length;i++){if(!used[set[i]]){pick=set[i];used[pick]=1;break}}
   if(!pick)pick=set[k++%set.length];
   c.avatars[n]=pick;
  }
 });
}
function av(c,n,cls){
 var set=SETS[c.gender]||SETS.g,e=(c.avatars&&c.avatars[n])||set[0],i=set.indexOf(e);
 return '<span class="av '+(cls||'')+'" style="background:'+AVBG[(i<0?0:i)%AVBG.length]+'">'+e+'</span>';
}
function pts(c,n){return (c.points&&c.points[n])||0}
function addPts(c,n,d){
 if(!c.points)c.points={};
 var before=pts(c,n),v=Math.max(0,before+d);c.points[n]=v;save();
 if(d>0){tone(784,.12,0,'triangle',.2);tone(1175,.2,.1,'triangle',.2)}else{tone(300,.2,0,'sawtooth',.1);tone(220,.25,.12,'sawtooth',.1)}
 return v;
}

/* sound */
var AC=null;
function tone(f,d,t0,type,v){
 if(!S.sound)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);
 }catch(e){}
}

/* ---------- الدقيقة الواحدة ---------- */
function fmt(s){s=Math.ceil(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function durLabel(d){return d===30?'30 ثانية':d===60?'دقيقة':d===120?'دقيقتان':'3 دقائق'}
function tabMinute(st,c){
 var C=2*Math.PI*110,dur=c.minute.dur||60,remMs=dur*1000,run=false,endAt=0,iv=null;
 st.innerHTML='<input id="q" class="qin" placeholder="اكتب السؤال أو المهمة هنا ليظهر للطلاب…" value="'+esc(c.minute.q||'')+'">'+
 '<div class="qshow" id="qs"></div>'+
 '<div class="chips">'+[30,60,120,180].map(function(d){return '<button class="chip" data-d="'+d+'">'+durLabel(d)+'</button>'}).join('')+'</div>'+
 '<div class="ring" id="ring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="110" class="ring-bg"/><circle id="arc" cx="130" cy="130" r="110" class="ring-fg" stroke-dasharray="'+C+'" stroke-dashoffset="0" transform="rotate(-90 130 130)"/></svg><div class="time" id="tm"></div></div>'+
 '<div class="row center"><button id="go" class="xl">▶ ابدأ</button><button id="rs" class="soft xl">↺ إعادة</button></div>';
 var tm=$('#tm',st),arc=$('#arc',st),ring=$('#ring',st),go=$('#go',st),qs=$('#qs',st);
 function paint(){tm.textContent=fmt(remMs/1000);arc.style.strokeDashoffset=String(C*(1-remMs/(dur*1000)));ring.classList.toggle('urgent',run&&remMs<=10000)}
 function stop(){run=false;clearInterval(iv);iv=null;go.textContent='▶ ابدأ'}
 function reset(){stop();remMs=dur*1000;ring.classList.remove('done');paint()}
 function finish(){stop();remMs=0;paint();ring.classList.add('done');tm.textContent='انتهى!';[0,.35,.7].forEach(function(t){tone(880,.3,t,'square',.15)});tone(1175,.6,1.05,'square',.15)}
 function marks(){Array.prototype.forEach.call(st.querySelectorAll('.chip'),function(b){b.classList.toggle('on',+b.dataset.d===dur)})}
 go.onclick=function(){
  if(run){stop();return}
  ring.classList.remove('done');if(remMs<=0)remMs=dur*1000;
  run=true;endAt=Date.now()+remMs;go.textContent='⏸ إيقاف مؤقت';tone(660,.12);
  iv=setInterval(function(){remMs=Math.max(0,endAt-Date.now());paint();if(remMs<=0)finish()},100);
 };

  var s=list[i],p=pair(),A=p[0],B=p[1],n=s.p.length,k=0,solved={},tries=0,dir='R';
  var END=P('sky','castle:400,372,.8;dragon:150,380,.9,p;dragon:650,380,.9,o,f;star:300,110,1.6;star:500,90,1.4;star:400,60,1;star:90,150,1.1;star:720,130,1.2;flower:250,400,1,a;flower:560,400,1,b','');
  END.pos=[300,418,500,418];
  function plain(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent}
  function say(txt){stop();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
   try{var u=new SpeechSynthesisUtterance(txt);u.lang='ar-SA';u.rate=.85;speaking=true;u.onend=function(){speaking=false;if(sp)sp.textContent='🔊 اقرأ لي'};speechSynthesis.speak(u);if(sp)sp.textContent='⏹ إيقاف'}catch(e){}}
  function chHTML(ch,done){
   return '<div class="chl"><div class="cq">🧩 تحدّي التفكير: '+ch.q+'</div>'+(ch.v?'<div class="cv">'+ch.v+'</div>':'')+'<div class="co">'+ch.o.map(function(o,j){return '<button data-j="'+j+'"'+(done&&j===ch.a?' class="ok"':'')+'>'+o+'</button>'}).join('')+'</div><div class="cm'+(done?' good':'')+'" id="cm">'+(done?'أحسنتم! 🎉':'')+'</div></div>'}
  function page(){
   stop();tries=0;var end=k>=n,pg=end?END:s.p[k],ch=end?null:pg.c,tx=end?'':gT(pg.t,c,A,B);
   var h='<div class="rd"><div class="rdtop"><button class="soft" id="bk">⬅ المكتبة</button><b class="rdt">'+esc(s.title)+'</b><button class="soft" id="sp">🔊 اقرأ لي</button></div>'+
   '<div class="scn flip'+dir+'" id="pgw">'+sceneSVG(pg,A,B,c)+'</div>';
   if(!end){h+='<div class="txt flip'+dir+'">'+tx+'</div>'+(ch?chHTML(ch,solved[k]):'')}
   else{var v=s.val;
    h+='<div class="endbox flip'+dir+'"><h3>🌟 نهاية القصة</h3><p class="recap">📚 ما تعلّمناه: '+gT(s.recap,c,A,B)+'</p><div class="valcard"><b>💎 القيمة: '+esc(v.n)+'</b><q>'+v.q+'</q><small>'+esc(v.s)+'</small><p>'+esc(v.d)+'</p></div>'+
    '<div class="row center"><button class="plus" data-w="0">⭐ نقطة لـ '+esc(A)+'</button><button class="plus" data-w="1">⭐ نقطة لـ '+esc(B)+'</button></div><div class="row center" style="margin-top:12px"><button id="again" class="soft">↺ أعيدوا القصة</button><button id="oth">📚 قصة أخرى</button></div></div>'}
   h+='<div class="rdnav"><button id="pv" class="soft"'+(k===0?' disabled':'')+'>▶ السابق</button><div class="dots">'+Array.from({length:n+1},function(_,j){return '<i class="'+(j===k?'on':j<k?'dn':'')+'"></i>'}).join('')+'</div><button id="nx"'+(end||(ch&&!solved[k])?' disabled':'')+'>التالي ◀</button></div></div>';
   st.innerHTML=h;window.scrollTo(0,0);
   sp=$('#sp',st);if(!window.speechSynthesis)sp.hidden=true;
   sp.onclick=function(){if(speaking){stop();sp.textContent='🔊 اقرأ لي';return}say(end?plain(s.recap)+' القيمة: '+s.val.n+'. '+plain(s.val.q):plain(tx)+(ch?' '+plain(ch.q):''))};
   $('#bk',st).onclick=listView;
   $('#pv',st).onclick=function(){if(k>0){k--;dir='L';page()}};
   $('#nx',st).onclick=function(){if(k<n){k++;dir='R';if(k===n){c.read[gr+'-'+i]=true;save();chime()}page()}};
   if(ch){
    var cm=$('#cm',st),opts=st.querySelectorAll('.co button');
    Array.prototype.forEach.call(opts,function(b){b.onclick=function(){
     if(solved[k])return;
     if(+b.dataset.j===ch.a){solved[k]=true;b.classList.add('ok');cm.textContent='أحسنتم! 🎉';cm.className='cm good';chime();$('#nx',st).disabled=false}
     else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');tries++;tone(240,.2,0,'sawtooth',.08);cm.className='cm try';cm.textContent='حاولوا مرة أخرى 💡 '+ch.h;
      if(tries>=2&&!$('#skip',cm)){cm.insertAdjacentHTML('beforeend',' <button id="skip" class="soft" style="min-height:40px">تخطّي ⏭</button>');$('#skip',cm).onclick=function(){solved[k]=true;$('#nx',st).disabled=false;cm.textContent='لنكمل المغامرة!'}}}
    }});
   }
   if(end){
    Array.prototype.forEach.call(st.querySelectorAll('.plus[data-w]'),function(b){b.onclick=function(){var w=+b.dataset.w?B:A;addPts(c,w,S.step);toast('⭐ أُضيفت نقطة لـ '+w)}});
    $('#again',st).onclick=function(){k=0;solved={};dir='L';page()};
    $('#oth',st).onclick=listView;
   }
  }
  page();
 }
 listView();
}

render();
})();
</script>
